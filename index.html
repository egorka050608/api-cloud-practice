<html>
    <head>
        <title> Мой первый API клиент</title>
    </head>
    <body>
        <h1>Список пользователей из Облака</h1>
        <buttion id="doadBtn">Загрузить данные через API</buttion>
        <ul id="userList"> </ul>

        <script>
            const buttiom = document.getElementById('loadBtn');
            const list = document.getElementById('userList');

            button.addEventListener('click', async() => {
                button.innerText ='Загрузка...';

                const response = await fetch('https://jsonplaceholder.typicode.com/users');
                const users = await response.json();

                list.innerHTML = '';
                users.forEach(user =>{
                    const li = document.createElement('li');
                    li.innerText = user.name + '('+ user.email')';
                    list.appendChild(li);
                });
                buttion.innerText = 'Данные загружены!';
            });
        </script>
    </body>
</html>
