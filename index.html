<html>
  <head>
    <title>Мой первый API клиент</title>
  </head>
  <body>
    <h1>Список пользователей из Облака</h1>
    <button id="loadBtn">Загрузить данные через API</button>
    <ul id="userList"></ul>

    <script>
      const button = document.getElementById('loadBtn');
      const list = document.getElementById('userList');

      button.addEventListener('click', async () => {
        button.innerText = 'Загрузка...';

        try {
          
          const response = await fetch('https://pokeapi.co/api/v2/pokemon/pikachu');
          
          if (!response.ok) {
            throw new Error(`Ошибка HTTP: ${response.status}`);
          }

          const data = await response.json();

          
          list.innerHTML = '';

          
          const li = document.createElement('li');
          li.innerText = `Имя: ${data.name}, Вес: ${data.weight}`;
          list.appendChild(li);

          button.innerText = 'Данные загружены!';
        } catch (error) {
          console.error('Ошибка при загрузке данных:', error);
          list.innerHTML = '<li>Ошибка загрузки данных. Проверьте консоль.</li>';
          button.innerText = 'Загрузить данные через API';
        }
      });
    </script>
  </body>
</html>
